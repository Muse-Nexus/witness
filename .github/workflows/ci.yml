name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-core:
    name: Web, core and detector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Wrangler (the Worker and its test pool) needs Node 22 or later; do not rely on the image's default.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.23

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Reject committed secrets and local config
        run: |
          if git ls-files | grep -E '(^|/)(\.env[^/]*|\.dev\.vars[^/]*)$' | grep -vE '\.(env|dev\.vars)\.example$'; then
            echo "Local configuration files must not be committed." >&2
            exit 1
          fi
          if git grep -InE '(sk-[A-Za-z0-9_-]{40,}|re_[A-Za-z0-9]{8,}_[A-Za-z0-9]{16,}|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|wit_(sess|link|agent|dev)_[A-Za-z0-9_-]{43}|WITNESS_MASTER_KEY=[A-Za-z0-9+/]{42,43}=)' -- . ':!*.lock'; then
            echo "Possible secret committed. Use obviously fake values in fixtures." >&2
            exit 1
          fi

  mac:
    name: Witness for Mac, and the end-to-end test
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test with synthetic Messages data
        run: swift test

      # The end-to-end test runs here because this runner has Chrome and Swift: the web
      # app in headless Chrome against the real Worker (wrangler dev, local D1/R2), MCP,
      # inbound email, the cron, and the real witness-mac CLI. Synthetic data only.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.23

      - name: Install locked dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: End-to-end
        working-directory: .
        env:
          CHROME: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: bun run e2e
