name: Feature idea
description: Suggest an improvement that keeps Witness safe and low-effort.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Witness is built for people who may not open an app on a hard day. The best ideas ask less of them, not more. Please read docs/SAFETY.md first: mood detection, streaks, scores, public sharing and outreach without consent are out of scope.
  - type: textarea
    id: outcome
    attributes:
      label: What would be better for the person using Witness?
      description: Describe the outcome, not only the feature.
    validations:
      required: true
  - type: textarea
    id: effort
    attributes:
      label: How much does it ask of them?
      description: What does someone have to do, once or ever, for this to work?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Safety and privacy
      description: How does this stay verbatim, consent-based and private? What new data, if any, would be stored or leave a device?
    validations:
      required: true
  - type: checkboxes
    id: hygiene
    attributes:
      label: Privacy
      options:
        - label: This idea uses only synthetic examples.
          required: true
